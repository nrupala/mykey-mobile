apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

import groovy.json.JsonSlurper

// Version: package.json is the single source of truth.
// versionName = the package version verbatim; versionCode is derived
// monotonically from it: major*10000 + minor*100 + patch
// (e.g. 1.3.0 -> 10300). Semver increases keep versionCode increasing;
// patch is capped at 99 by construction of the scheme.
def pkgJson = new JsonSlurper().parse(file('../../package.json'))
def pkgVersionParts = pkgJson.version.tokenize('.').collect { it.toInteger() }
def derivedVersionCode = pkgVersionParts[0] * 10000 + pkgVersionParts[1] * 100 + pkgVersionParts[2]

// Release signing: the permanent MyKey release key (held by
// 2351485 ALBERTA INC.) reaches the build ONLY through environment
// variables — in CI they come from GitHub Actions secrets; the
// keystore itself is never in this repository. Without the env vars
// the release build stays unsigned (local-dev behaviour, unchanged).
def releaseKeystore = System.getenv('MYKEY_KEYSTORE_PATH')
def hasReleaseKey = releaseKeystore != null && file(releaseKeystore).exists()

android {
    namespace = "com.usemykey.mykey"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.usemykey.mykey"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode derivedVersionCode
        versionName pkgJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(releaseKeystore)
                storeType 'JKS'
                storePassword System.getenv('MYKEY_STORE_PASSWORD')
                keyAlias System.getenv('MYKEY_KEY_ALIAS')
                keyPassword System.getenv('MYKEY_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.autofill:autofill:$androidxAutofillVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Passkey wave: Credential Manager provider APIs (Kotlin).
    implementation "androidx.credentials:credentials:1.5.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
