name: Android — signed release APK + debug APK + release AAB

# Builds the Android app from the SAME web client as the PWA
# (Capacitor wraps dist/). Signing, stated plainly:
#   - the release APK is SIGNED with the permanent MyKey release
#     key (held by 2351485 ALBERTA INC., custody outside this
#     repository). CI receives it only as Actions secrets
#     (MYKEY_KEYSTORE_B64 + passwords), decoded to a temp file for
#     the build and never committed. One permanent key is what lets
#     Android update the app in place — builds signed with the old
#     ephemeral debug keys cannot be updated over.
#   - the debug APK still uses the standard Android debug key —
#     for device testing only;
#   - the release AAB stays UNSIGNED here on purpose: Play App
#     Signing signs the store build at enrolment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages (runner-provided Android SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build the web client and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: No logging in the autofill module (hardening gate)
        run: |
          # The autofill + plugin sources must never write to
          # logcat: targets, fields, and outcomes stay silent.
          if grep -rn "android.util.Log\|Log\.\(d\|v\|i\|w\|e\)(" \
              android/app/src/main/java/com/usemykey/mykey/autofill \
              android/app/src/main/java/com/usemykey/mykey/MyKeyAutofillPlugin.kt; then
            echo "logging call found in the autofill module" >&2
            exit 1
          fi

      - name: Native unit tests (autofill heuristics, cert digest, router)
        working-directory: android
        run: sh ./gradlew testDebugUnitTest --stacktrace

      - name: Stage the release keystore (CI secrets only)
        env:
          MYKEY_KEYSTORE_B64: ${{ secrets.MYKEY_KEYSTORE_B64 }}
        run: |
          # Fork PRs receive no secrets: the gradle build then
          # produces an unsigned release APK, as before.
          if [ -n "$MYKEY_KEYSTORE_B64" ]; then
            echo "$MYKEY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mykey-release.jks"
            chmod 600 "$RUNNER_TEMP/mykey-release.jks"
            echo "MYKEY_KEYSTORE_PATH=$RUNNER_TEMP/mykey-release.jks" >> "$GITHUB_ENV"
            echo "release keystore staged"
          else
            echo "no release keystore secret available — release APK will be unsigned"
          fi

      - name: Build debug APK, signed release APK, and release AAB
        working-directory: android
        env:
          MYKEY_STORE_PASSWORD: ${{ secrets.MYKEY_STORE_PASSWORD }}
          MYKEY_KEY_ALIAS: ${{ secrets.MYKEY_KEY_ALIAS }}
          MYKEY_KEY_PASSWORD: ${{ secrets.MYKEY_KEY_PASSWORD }}
        run: sh ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mykey-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
