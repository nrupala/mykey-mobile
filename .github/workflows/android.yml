name: Android — debug APK + release AAB

# Builds the Android app from the SAME web client as the PWA
# (Capacitor wraps dist/). Signing, stated plainly:
#   - the debug APK uses the standard Android debug key — for
#     device testing only;
#   - the release AAB is UNSIGNED. It becomes shippable through
#     Play App Signing enrolment (a human account step), never via
#     a keystore committed to or generated by this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages (runner-provided Android SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build the web client and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK and unsigned release AAB
        working-directory: android
        run: sh ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mykey-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
